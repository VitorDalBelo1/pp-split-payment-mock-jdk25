quarkus.application.name=pp-split-payment-mock
quarkus.http.port=${PORT:8080}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
# O documento servido e exatamente o contrato original
# (src/main/resources/META-INF/openapi.json). O scan de anotacoes fica
# desligado para que o Swagger mostre o contrato 100% fiel, com todos os
# schemas, exemplos e validacoes documentadas.
# ---------------------------------------------------------------------------
mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.title=Plataforma Publica de Split Payment API (MOCK)

# Aponta o "Try it out" do Swagger para a propria aplicacao
quarkus.smallrye-openapi.servers=http://localhost:8080

# ---------------------------------------------------------------------------
# Comportamento do mock
# ---------------------------------------------------------------------------
# Latencia artificial em milissegundos aplicada a todas as respostas (0 = sem atraso)
mock.delay-ms=0

# Cache-Control max-age (segundos) do endpoint /.well-known/jwks.json
mock.jwks.cache-max-age-seconds=300

quarkus.log.level=INFO
quarkus.log.category."br.gov.pp.splitpayment".level=DEBUG

